<?xml version="1.0" encoding="UTF-8"?>
<!-- Decorative art for confirmation-guidelines.php's sidebar card: a dove
     descending in a burst of light, the traditional image for the Holy
     Spirit's descent at Confirmation. A self-contained square-ish image
     (dark gradient background baked in), unlike the other pages' banner-art
     SVGs which sit on the page's own cream background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <radialGradient id="spiritGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5c1b2e"/>
      <stop offset="55%" stop-color="#3d0f1f"/>
      <stop offset="100%" stop-color="#1a0810"/>
    </radialGradient>
    <linearGradient id="spiritDove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e2b3"/>
      <stop offset="100%" stop-color="#c9a24a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#spiritGlow)"/>

  <!-- light rays radiating from behind the dove -->
  <g stroke="#e6cf94" stroke-width="1.4" opacity="0.4" stroke-linecap="round">
    <path d="M200 95 L200 25"/>
    <path d="M200 95 L145 35"/>
    <path d="M200 95 L255 35"/>
    <path d="M200 95 L100 65"/>
    <path d="M200 95 L300 65"/>
    <path d="M200 95 L80 105"/>
    <path d="M200 95 L320 105"/>
  </g>
  <circle cx="200" cy="95" r="70" fill="#e6cf94" opacity="0.1"/>

  <!-- dove, wings spread wide, descending -->
  <g fill="url(#spiritDove)">
    <!-- left wing -->
    <path d="M188 108 C150 92 110 78 68 92 C104 104 132 118 158 132 C168 124 178 116 188 108 Z"/>
    <!-- right wing (mirrored) -->
    <path d="M212 108 C250 92 290 78 332 92 C296 104 268 118 242 132 C232 124 222 116 212 108 Z"/>
    <!-- tail -->
    <path d="M197 138 C192 156 190 172 194 188 C198 174 202 174 206 188 C210 172 208 156 203 138 Z"/>
    <!-- body -->
    <ellipse cx="200" cy="118" rx="15" ry="26"/>
    <!-- neck + head -->
    <path d="M197 96 C195 86 197 78 203 72 C209 78 211 86 209 96 C205 100 201 100 197 96 Z"/>
    <circle cx="204" cy="76" r="9"/>
    <!-- beak -->
    <path d="M211 74 L221 71 L213 80 Z"/>
  </g>
  <circle cx="207" cy="73" r="1.4" fill="#3d0f1f"/>
</svg>
