<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · ParishServe</title>
<meta name="description" content="Log in to your ParishServe account to manage parish services and requests for Our Lady of the Gate Parish.">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="assets/css/responsive.css?v=3">
</head>
<body>

<div class="auth-shell">
    <div class="auth-visual">
        <div class="auth-visual-media">
            <img src="assets/images/parish-login.svg" alt="Our Lady of the Gate Parish church at golden hour">
        </div>

        <div class="auth-brand">
            <span class="auth-brand-crest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1.6 1.6 3.5 2.2 5.5 2.2v6.3C17.5 15 15.3 19 12 21c-3.3-2-5.5-6-5.5-10.5V4.2C8.5 4.2 10.4 3.6 12 2z"/><path d="M12 8.5v6M9 11.5h6"/></svg></span>
            <span class="auth-brand-text">
                <strong>Our Lady<br>of the Gate Parish</strong>
                <em>ParishServe</em>
            </span>
        </div>

        <div class="auth-welcome">
            <div class="ps-heading-ornament"><span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M7 8h10"/></svg><span></span></div>
            <h2>Welcome Back!</h2>
            <p>Log in to access your ParishServe account and continue managing your parish services and requests.</p>
        </div>
    </div>

    
    <div class="auth-panel">
        <div class="auth-card">

            <div class="ps-heading-ornament auth-card-ornament"><span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="M7 8h10"/></svg><span></span></div>
            <h1>Log In</h1>
            <p class="auth-sub">Enter your credentials to access your account.</p>

            <div class="auth-alert" data-auth-alert role="alert" tabindex="-1" hidden><span data-auth-message></span></div>
            <form action="login.php" method="post" data-login-form novalidate>

                <div class="ps-field auth-field">
                    <label for="loginEmail">Email Address</label>
                    <span class="ps-field-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>                        <input type="email" id="loginEmail" name="email" autocomplete="username" placeholder="Enter your email address" aria-describedby="loginEmailError" required>
                    </span>
                    <small class="auth-field-error" id="loginEmailError" data-field-error="email" hidden></small>
                </div>

                <div class="ps-field auth-field">
                    <label for="loginPassword">Password</label>
                    <span class="ps-field-icon has-trailing">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>                        <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="loginPasswordError" required>
                        <button type="button" class="auth-password-toggle" data-password-toggle aria-label="Show password" aria-pressed="false">
                            <svg class="auth-eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>                            <svg class="auth-eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.7 17.7 0 0 1-3.2 4.1M6.5 6.5C3.9 8.2 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>                        </button>
                    </span>
                    <small class="auth-field-error" id="loginPasswordError" data-field-error="password" hidden></small>
                </div>

                <div class="auth-forgot">
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>

                <button type="submit" class="ps-btn ps-btn-primary auth-submit" data-login-submit>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg> <span data-submit-label>Log In</span>
                </button>

                <div class="auth-divider"><span>or</span></div>

                <a href="register.html" class="ps-btn ps-btn-outline auth-submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg> Create an Account</a>

            </form>

            <p class="auth-privacy-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Your privacy and security are important to us.</p>

        </div>
    </div>

</div>

<script src="assets/js/auth.js"></script>
<script src="assets/js/frontend.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/responsive.js?v=1"></script>
</body>
</html>
